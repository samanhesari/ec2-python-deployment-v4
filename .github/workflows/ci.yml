name: V4 CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write


jobs:

  test:

    name: Run Tests

    runs-on: ubuntu-latest

    services:

      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: v4_app_test
          MYSQL_USER: v4user
          MYSQL_PASSWORD: v4password
          MYSQL_ROOT_PASSWORD: rootpassword

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v


  build-and-push:

    name: Build and Push Docker Image

    needs: test

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  deploy:

    name: Deploy to AWS EC2

    needs: build-and-push

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |

          set -x

          echo "========================================"
          echo "        V4.6 EC2 DEPLOYMENT"
          echo "========================================"

          echo
          echo "[INFO] EC2 host: $EC2_HOST"
          echo "[INFO] EC2 user: $EC2_USER"
          echo "[INFO] Image: $IMAGE_NAME"

          echo
          echo "[1/5] Preparing SSH..."

          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          echo
          echo "[2/5] Testing SSH connection..."

          ssh \
            -i ~/.ssh/ec2_key \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$EC2_USER@$EC2_HOST" \
            "echo '[SUCCESS] SSH connection works'"

          echo
          echo "[3/5] Checking Docker on EC2..."

          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "docker --version"

          echo
          echo "[4/5] Checking Docker Compose on EC2..."

          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "docker compose version"

          echo
          echo "[5/5] Preparing application directory..."

          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "mkdir -p ~/v4-app"

          echo
          echo "[INFO] Copying production Compose file..."

          scp \
            -i ~/.ssh/ec2_key \
            docker-compose.prod.yml \
            "$EC2_USER@$EC2_HOST:~/v4-app/docker-compose.prod.yml"

          echo
          echo "[INFO] Pulling application image..."

          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "cd ~/v4-app && IMAGE_NAME='$IMAGE_NAME' docker compose -f docker-compose.prod.yml pull"

          echo
          echo "[INFO] Starting application..."

          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "cd ~/v4-app && IMAGE_NAME='$IMAGE_NAME' docker compose -f docker-compose.prod.yml up -d"

          echo
          echo "[INFO] Application status..."

          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "cd ~/v4-app && docker compose -f docker-compose.prod.yml ps"

          echo
          echo "========================================"
          echo "        DEPLOYMENT COMPLETE"
          echo "========================================"